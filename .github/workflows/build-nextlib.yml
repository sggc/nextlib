name: Build NextLib with CAVS/AVS2/AVS3 support

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0-cavs)"
        required: true
        default: "v1.0.0-cavs"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build NextLib AAR
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # 【2026-10-14】不再依赖 android-actions/setup-android@v3 —— 该 action 自身
      # 退化（2026-07-25 的老 run 还是好的，最近开始启动即失败）。改为直接下载
      # Google 官方 cmdline-tools 自行安装，链路短、可控、无第三方依赖。
      - name: Install Android SDK cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk"
          curl -fL --retry 3 -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip && rm -f cmdline.zip
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt \
             cmdline-tools/source.properties cmdline-tools/latest 2>/dev/null || true
          # sdkmanager 需要在 cmdline-tools/latest/bin 下
          if [ ! -x "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            nasm yasm python3-pip git autoconf automake libtool \
            cmake ccache unzip wget curl

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Replace CMakeLists.txt for static FFmpeg linking
        run: |
          CMAKE_FILE="media3ext/src/main/cpp/CMakeLists.txt"
          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt not found at $CMAKE_FILE"
            find media3ext -name "CMakeLists.txt" -ls
            exit 1
          fi
          echo "=== Original CMakeLists.txt ==="
          cat "$CMAKE_FILE"

          # Replace CMakeLists.txt to link individual .a files directly.
          # NO merged archive — link the original .a files as-is.
          # --whole-archive ensures ALL code is included (decoders, demuxers, etc.)
          # --start-group/--end-group handles circular deps between libraries.
          #
          # Path: CMakeLists.txt is at media3ext/src/main/cpp/
          #   CMAKE_SOURCE_DIR = media3ext/src/main/cpp/
          #   ../../../../ = repo root
          cat > "$CMAKE_FILE" << 'CMAKEOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("media3ext")

          set(ffmpeg_dir ${CMAKE_SOURCE_DIR}/../../../../ffmpeg/output)
          set(ffmpeg_libs ${ffmpeg_dir}/lib/${ANDROID_ABI})
          include_directories(${ffmpeg_dir}/include/${ANDROID_ABI})

          add_library(${CMAKE_PROJECT_NAME} SHARED
                  ffmain.cpp
                  ffcommon.cpp
                  ffaudio.cpp
                  ffvideo.cpp)

          set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-z,max-page-size=16384")

          target_link_libraries(${CMAKE_PROJECT_NAME}
                  log
                  android
                  -Wl,--whole-archive
                  ${ffmpeg_libs}/libavcodec.a
                  ${ffmpeg_libs}/libavformat.a
                  ${ffmpeg_libs}/libavutil.a
                  ${ffmpeg_libs}/libswresample.a
                  ${ffmpeg_libs}/libswscale.a
                  ${ffmpeg_libs}/libdavs2.a
                  ${ffmpeg_libs}/libuavs3d.a
                  ${ffmpeg_libs}/libvpx.a
                  -Wl,--no-whole-archive
                  -Wl,--start-group
                  ${ffmpeg_libs}/libmbedcrypto.a
                  ${ffmpeg_libs}/libmbedtls.a
                  ${ffmpeg_libs}/libmbedx509.a
                  -Wl,--end-group
                  z
                  m
                  dl)
          CMAKEOF

          echo "=== Patched CMakeLists.txt ==="
          cat "$CMAKE_FILE"

          # Verify the patch
          if grep -q 'libffmpeg_all' "$CMAKE_FILE"; then
            echo "FATAL: merged archive reference still present"
            exit 1
          fi
          if ! grep -q 'libavcodec.a' "$CMAKE_FILE"; then
            echo "FATAL: libavcodec.a not found in CMakeLists.txt"
            exit 1
          fi
          if grep -q 'IMPORTED' "$CMAKE_FILE"; then
            echo "FATAL: IMPORTED library references still present"
            exit 1
          fi
          echo "=== Patch verification passed ==="

      - name: Build AAR (includes ffmpegSetup task)
        run: ./gradlew :media3ext:assembleRelease

      - name: Verify build output
        run: |
          echo "=== FFmpeg output libraries ==="
          find ffmpeg/output -name "*.a" 2>/dev/null | sort || echo "WARNING: No FFmpeg static libraries found"
          echo "=== Verify key symbols exist in .a files ==="
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for ABI in arm64-v8a; do
            LIBDIR="ffmpeg/output/lib/${ABI}"
            echo "--- Checking ${ABI} ---"
            echo "avcodec_free_context:" $(${NM} ${LIBDIR}/libavcodec.a 2>/dev/null | grep -c "T avcodec_free_context")
            echo "av_frame_alloc:" $(${NM} ${LIBDIR}/libavutil.a 2>/dev/null | grep -c "T av_frame_alloc")
            echo "swr_alloc:" $(${NM} ${LIBDIR}/libswresample.a 2>/dev/null | grep -c "T swr_alloc")
          done
          echo "=== AAR files ==="
          find media3ext/build/outputs/aar -name "*.aar" -ls

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextlib-media3ext-cavs-release
          path: media3ext/build/outputs/aar/*.aar
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NextLib ${{ inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            media3ext/build/outputs/aar/*.aar
