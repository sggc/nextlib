name: Build NextLib with CAVS/AVS2/AVS3 support

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0-cavs)"
        required: true
        default: "v1.0.0-cavs"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build NextLib AAR
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            nasm yasm python3-pip git autoconf automake libtool \
            cmake ccache unzip wget curl

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Replace CMakeLists.txt for static FFmpeg linking
        run: |
          CMAKE_FILE="media3ext/src/main/cpp/CMakeLists.txt"
          if [ ! -f "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt not found at $CMAKE_FILE"
            find media3ext -name "CMakeLists.txt" -ls
            exit 1
          fi
          echo "=== Original CMakeLists.txt ==="
          cat "$CMAKE_FILE"

          # Replace the entire CMakeLists.txt with a static-linking version.
          # The original uses IMPORTED SHARED libraries (libavcodec.so etc.)
          # which don't exist in a static build. We replace them with a single
          # libffmpeg_all.a (merged static archive) using -Wl,--whole-archive.
          #
          # Path: CMakeLists.txt is at media3ext/src/main/cpp/
          #   CMAKE_SOURCE_DIR = media3ext/src/main/cpp/
          #   ../../../../ = repo root
          #   So ${CMAKE_SOURCE_DIR}/../../../../ffmpeg/output = <repo>/ffmpeg/output
          cat > "$CMAKE_FILE" << 'CMAKEOF'
cmake_minimum_required(VERSION 3.22.1)
project("media3ext")

set(ffmpeg_dir ${CMAKE_SOURCE_DIR}/../../../../ffmpeg/output)
set(ffmpeg_libs ${ffmpeg_dir}/lib/${ANDROID_ABI})
include_directories(${ffmpeg_dir}/include/${ANDROID_ABI})

add_library(${CMAKE_PROJECT_NAME} SHARED
        ffmain.cpp
        ffcommon.cpp
        ffaudio.cpp
        ffvideo.cpp)

set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-z,max-page-size=16384")

target_link_libraries(${CMAKE_PROJECT_NAME}
        log
        android
        -Wl,--whole-archive
        ${ffmpeg_libs}/libffmpeg_all.a
        -Wl,--no-whole-archive
        z
        m
        dl
        pthread)
CMAKEOF

          echo "=== Patched CMakeLists.txt ==="
          cat "$CMAKE_FILE"

          # Verify the patch
          if ! grep -q 'libffmpeg_all.a' "$CMAKE_FILE"; then
            echo "FATAL: Patch failed - libffmpeg_all.a not found in CMakeLists.txt"
            exit 1
          fi
          if grep -q 'IMPORTED' "$CMAKE_FILE"; then
            echo "FATAL: Patch failed - IMPORTED library references still present"
            exit 1
          fi
          if grep -q 'ffmpeg_libs_names' "$CMAKE_FILE"; then
            echo "FATAL: Patch failed - ffmpeg_libs_names still present"
            exit 1
          fi
          echo "=== Patch verification passed ==="

      - name: Build AAR (includes ffmpegSetup task)
        run: ./gradlew :media3ext:assembleRelease

      - name: Verify build output
        run: |
          echo "=== FFmpeg output libraries ==="
          find ffmpeg/output -name "*.a" 2>/dev/null | sort || echo "WARNING: No FFmpeg static libraries found"
          find ffmpeg/output -name "*.so" 2>/dev/null | sort || echo "(No shared libraries, expected with static build)"
          echo "=== AAR files ==="
          find media3ext/build/outputs/aar -name "*.aar" -ls

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextlib-media3ext-cavs-release
          path: media3ext/build/outputs/aar/*.aar
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NextLib ${{ inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            media3ext/build/outputs/aar/*.aar
