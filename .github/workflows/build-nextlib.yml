name: Build NextLib with CAVS/AVS2/AVS3 support

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0-cavs)"
        required: true
        default: "v1.0.0-cavs"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  build:
    name: Build NextLib AAR
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            nasm yasm python3-pip git autoconf automake libtool \
            cmake ccache unzip wget curl

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Patch CMakeLists.txt for static FFmpeg linking
        run: |
          CMAKE_FILE="media3ext/src/main/cpp/CMakeLists.txt"
          if [ ! -f "$CMAKE_FILE" ]; then
            echo "Searching for CMakeLists.txt..."
            find media3ext -name "CMakeLists.txt" -ls
            CMAKE_FILE=$(find media3ext -name "CMakeLists.txt" | head -1)
          fi
          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi
          echo "=== Patching $CMAKE_FILE for static FFmpeg linking ==="
          echo "=== Original content ==="
          cat "$CMAKE_FILE"

          # Use awk to patch CMakeLists.txt in a single pass:
          # 1. Capture the FFmpeg path prefix from the first line with a known library name
          # 2. Remove all lines with individual FFmpeg/dependency .so or .a references
          # 3. Insert merged libffmpeg_all.a + system libs before closing paren of target_link_libraries
          awk '
          BEGIN { in_tll = 0; patched = 0; ffprefix = "" }
          /lib(avcodec|avformat|avutil|swresample|avfilter|swscale|davs2|vpx|mbedtls|mbedcrypto|mbedx509)\.(so|a)/ {
              if (ffprefix == "") {
                  match($0, /lib(avcodec|avformat|avutil|swresample|avfilter|swscale|davs2|vpx|mbedtls|mbedcrypto|mbedx509)\./)
                  if (RSTART > 0) {
                      ffprefix = substr($0, 1, RSTART - 1)
                      sub(/^ +/, "", ffprefix)
                  }
              }
              next
          }
          /target_link_libraries/ { in_tll = 1 }
          in_tll && /\)/ && !patched {
              if (ffprefix == "") ffprefix = "${CMAKE_CURRENT_SOURCE_DIR}/../../../ffmpeg/output/lib/${ANDROID_ABI}/"
              match($0, /^ */)
              indent = substr($0, 1, RLENGTH)
              print indent "-Wl,--whole-archive"
              print indent ffprefix "libffmpeg_all.a"
              print indent "-Wl,--no-whole-archive"
              print indent "z"
              print indent "m"
              print indent "dl"
              print indent "pthread"
              patched = 1
              in_tll = 0
          }
          { print }
          ' "$CMAKE_FILE" > "${CMAKE_FILE}.tmp" && mv "${CMAKE_FILE}.tmp" "$CMAKE_FILE"

          if ! grep -q 'libffmpeg_all.a' "$CMAKE_FILE"; then
            echo "WARNING: Patch did not insert merged library, appending to end"
            echo "" >> "$CMAKE_FILE"
            echo "# Static FFmpeg linking (auto-patched)" >> "$CMAKE_FILE"
            echo "target_link_libraries(media3ext" >> "$CMAKE_FILE"
            echo "    -Wl,--whole-archive" >> "$CMAKE_FILE"
            echo "    \${CMAKE_CURRENT_SOURCE_DIR}/../../../ffmpeg/output/lib/\${ANDROID_ABI}/libffmpeg_all.a" >> "$CMAKE_FILE"
            echo "    -Wl,--no-whole-archive" >> "$CMAKE_FILE"
            echo "    z" >> "$CMAKE_FILE"
            echo "    m" >> "$CMAKE_FILE"
            echo "    dl" >> "$CMAKE_FILE"
            echo "    pthread" >> "$CMAKE_FILE"
            echo ")" >> "$CMAKE_FILE"
          fi

          echo "=== Patched CMakeLists.txt ==="
          cat "$CMAKE_FILE"

      - name: Build AAR (includes ffmpegSetup task)
        run: ./gradlew :media3ext:assembleRelease

      - name: Verify build output
        run: |
          echo "=== FFmpeg output libraries ==="
          find ffmpeg/output -name "*.a" 2>/dev/null | sort || echo "WARNING: No FFmpeg static libraries found"
          find ffmpeg/output -name "*.so" 2>/dev/null | sort || echo "(No shared libraries, expected with static build)"
          echo "=== AAR files ==="
          find media3ext/build/outputs/aar -name "*.aar" -ls

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextlib-media3ext-cavs-release
          path: media3ext/build/outputs/aar/*.aar
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NextLib ${{ inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            media3ext/build/outputs/aar/*.aar
